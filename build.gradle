plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.16'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.flywaydb.flyway' version '11.20.3'
}

// Patched compatible BOM lines for advisories newer than Spring Boot 3.5.16.
ext['jackson-bom.version'] = '2.21.8'
ext['netty.version'] = '4.1.139.Final'
ext['log4j2.version'] = '2.25.5'

group = 'io.github.lambig'
version = '0.0.1-SNAPSHOT'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

repositories {
  mavenCentral()
}

dependencies {
  //Spring
  implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
  implementation 'org.springframework.boot:spring-boot-starter-webflux'
  implementation 'org.springframework.boot:spring-boot-starter-jdbc'
  //Lombok
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'
  // Jackson
  implementation 'com.fasterxml.jackson.core:jackson-core'
  //JAsync-sql
  implementation 'com.github.jasync-sql:jasync-mysql:2.1.23'
  implementation 'com.github.jasync-sql:jasync-r2dbc-mysql:2.1.23'
  implementation 'com.github.jasync-sql:jasync-pool:1.2.2'
  // In case I use r2dbc-mysql(not maintained recently)
  // implementation 'dev.miku:r2dbc-mysql:0.8.2.RELEASE'
  // Flyway with jdbc
  runtimeOnly "com.mysql:mysql-connector-j"
  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-mysql'
  // implementation 'org.flywaydb:flyway-mysql:8.2.0'

  //Spring Test
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  //Project Reactor Test
  testImplementation 'io.projectreactor:reactor-test'

  //Utilities
  implementation 'io.github.lambig:Either:0.1.0'
  implementation 'io.github.lambig:Patterns:1.1.0'
  implementation 'io.github.lambig:functional-interface-extension:1.1.2'
  implementation 'io.github.lambig:Tuplite:1.0.0'
}

tasks.named('test') {
  useJUnitPlatform()
}

tasks.register('restartDB') {
  Task me = it
  doLast {
    println me.name + ": db restarting... hopefully"
    "docker-compose restart".execute()
  }
}

tasks.register('stopDB') {
  Task me = it
  doLast {
    "docker-compose stop".execute()
    println me.name + ": db stopped... hopefully"
  }
}

flyway {
  baselineVersion = 0
  url = "jdbc:mysql://localhost:3306/webflux-playground"
  user = "player"
  password = "player_password"
}

def dbRequiringTasks = [
  // application
  bootRun,
  // migration
  flywayBaseline,
  flywayClean,
  flywayInfo,
  flywayMigrate,
  flywayRepair,
  flywayValidate
]

/* restart docker mysql before bootrun starts / stop it after bootrun ends */
dbRequiringTasks.forEach {
//  it.dependsOn restartDB
//  it.finalizedBy stopDB
}