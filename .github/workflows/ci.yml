name: Gradle CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: corretto
          java-version: '21'
      - name: Build and test
        run: |
          bash ./gradlew --no-daemon --console=plain -Dorg.gradle.jvmargs=-Xmx512m clean build
      - name: Preserve test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.run_attempt }}
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/**
          if-no-files-found: error
          retention-days: 14
      - name: Build and check development MySQL
        run: |
          docker build -t mysql-ci docker/mysql
          docker run -d --name mysql-ci -e MYSQL_ROOT_PASSWORD=synthetic-ci-only mysql-ci
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec mysql-ci mysqladmin ping -uroot -psynthetic-ci-only --silent; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker logs mysql-ci; exit 1; fi
          docker exec mysql-ci mysql -uroot -psynthetic-ci-only -e 'CREATE DATABASE security_smoke; CREATE TABLE security_smoke.items (id INT PRIMARY KEY); INSERT INTO security_smoke.items VALUES (1); SELECT * FROM security_smoke.items;'
